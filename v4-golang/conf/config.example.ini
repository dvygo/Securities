# Template — copy to config.ini and edit

[normalizer]
xnse_exchange = XNSE
xnfo_exchange = XNFO
xncd_exchange = XNCD
xbse_exchange = XBSE
xbfo_exchange = XBFO
xmcx_exchange = XIMC

[fyers]
base_url = https://public.fyers.in/sym_details
# Quote required: semicolons in UA are INI comments otherwise.
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
timeout_sec = 120
retries = 3
retry_delay_sec = 2

[postgres]
database_url = postgres://cuser:cpass@127.0.0.1:7730/cdb?sslmode=disable
