[databento]
api_key = db-YOUR_KEY_EQUS_OPRA
api_key_es = db-YOUR_KEY_GLBX

[normalizer]
glbx_underlying = ES
glbx_multiplier = 100000
glbx_exchange = XCME
opra_exchange = XCBO
opra_multiplier = 100000
equs_exchange = XNAS
equs_multiplier = 1
xnse_exchange = XNSE
xnfo_exchange = XNFO
xncd_exchange = XNCD
xbse_exchange = XBSE
xbfo_exchange = XBFO
xmcx_exchange = XMCX

[fyers]
base_url = https://public.fyers.in/sym_details
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
timeout_sec = 120
retries = 3
retry_delay_sec = 2

[postgres]
database_url = postgres://USER:PASS@127.0.0.1:7710/central?sslmode=disable
