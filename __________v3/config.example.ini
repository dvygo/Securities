[databento]
# Key 2 — OPRA.PILLAR (opra_pillar.py), EQUS.MINI (equs_mini.py)
api_key = db-YOUR_KEY_EQUS_OPRA
# Key 1 — GLBX.MDP3 (glbx_mdp3.py)
api_key_es = db-YOUR_KEY_GLBX

[normalizer]
glbx_underlying = ES
glbx_multiplier = 100000
glbx_exchange = XCME
opra_exchange = XCBO
opra_multiplier = 100000
equs_exchange = XNAS
equs_multiplier = 1

[postgres]
database_url = postgres://central:central_pass@127.0.0.1:7710/central?sslmode=disable
