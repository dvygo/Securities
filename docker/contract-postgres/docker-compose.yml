# PostgreSQL 16 — contract symbology DB (single instance).
#
# Host ports:
#   contractdb-contract-contract  localhost:6006  — primary (normalizer --postgres-push)
#
# From Premarket repo:
#   docker compose -f docker/contract-postgres/docker-compose.yml up -d
#
# Fresh cluster (wipes data):
#   docker compose -f docker/contract-postgres/docker-compose.yml down -v
#   docker compose -f docker/contract-postgres/docker-compose.yml up -d --build
#
# Database URL:
#   postgres://contract:contract@127.0.0.1:6006/contractdb?sslmode=disable

name: contract-postgres

services:
  contractdb-contract-contract:
    image: postgres:16-alpine
    container_name: contractdb-contract-contract
    hostname: contractdb-contract-contract
    environment:
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: contract
      POSTGRES_DB: contractdb
    ports:
      - "6006:5432"
    volumes:
      - contract_postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract -d contractdb"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    shm_size: "256m"

volumes:
  contract_postgres_data:
