[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "premarketv6"
version = "6.0.0"
description = "Pre-market symbology/instrument data pipeline for financial markets"
# numpy 2.5 requires >=3.12 and pandas 3.0 requires >=3.11, so the real floor is
# 3.12 -- ">=3.9" let pip resolve numpy/pandas years out of date on an older
# interpreter instead of refusing to install. clickhouse-connect currently caps
# at <3.15, which is the practical ceiling.
requires-python = ">=3.12"
dependencies = [
    # Keep this list and requirements.txt in step -- tests/test_packaging.py
    # fails the build if they drift, or if premarketv6 imports something that
    # neither one declares.
    #
    # databento is pre-1.0 and every minor is a breaking change; 1.0 does not
    # exist yet, so cap below it rather than opting in to it sight unseen.
    "databento>=0.81.0,<1.0",
    "psycopg[binary]>=3.1.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    # IST->UTC session conversion (premarketv6/normalize/session.py).
    "pytz>=2024.1",
    # Used by strategiesv6, which ships from this same source tree.
    "exchange-calendars>=4.5",
    # Parquet is the on-disk format for normalized/plugin output
    # (premarketv6/parquet_export.py).
    "pyarrow>=15.0",
    # ClickHouse HTTP client for the contracts push (premarketv6/clickhouse_export.py).
    "clickhouse-connect>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
