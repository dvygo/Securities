[package]
name = "rust-viewer"
version = "0.1.0"
edition = "2021"
description = "TUI viewer for the pipeline's on-disk formats: Parquet, DBN(.zst) and CSV"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
csv = "1.3"

# Parquet and DBN both need zstd page/frame decompression, and the `zstd` crate
# builds C. This box has no cc, so they sit behind a feature rather than
# breaking the CSV build that does work. Enable once build-essential is present:
#   cargo build --release --features columnar
arrow = { version = "53", optional = true }
parquet = { version = "53", optional = true, default-features = false, features = ["arrow", "zstd", "snap", "base64"] }
dbn = { version = "0.68", optional = true }
# DuckDB drives everything that is not Parquet: CSV type-sniffing, filtering
# and ORDER BY happen in the query rather than in Rust, per the "sort in the
# query" note. `bundled` compiles DuckDB's C++ amalgamation.
duckdb = { version = "1.1", optional = true, features = ["bundled"] }

[features]
default = []
columnar = ["dep:arrow", "dep:parquet", "dep:dbn"]
# DuckDB is a separate feature: it compiles a large C++ amalgamation, so it is
# opt-in rather than bundled into every build of the viewer.
duck = ["dep:duckdb"]

[profile.release]
opt-level = 3
lto = true
strip = true
