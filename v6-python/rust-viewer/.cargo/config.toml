# clang/LLVM as the C driver, via Zig's bundled toolchain in ~/.zig.
#
# This box has no gcc and sudo needs a password, so build-essential is not an
# option. `zig cc` is clang 21 with its own libc headers and compiler-rt, which
# is what makes it link here -- plain clang would still fail on -lgcc_s, the dev
# symlink libgcc-dev supplies and this box lacks.
#
# Native gnu target rather than static musl: the C dependencies (zstd for
# Parquet/DBN) build against the system libc this way, which is the path of
# least resistance now that a working driver exists.
[env]
CC = { value = "/home/deshik/.zig/shim/cc", force = true }
CXX = { value = "/home/deshik/.zig/shim/c++", force = true }

[target.x86_64-unknown-linux-gnu]
linker = "/home/deshik/.zig/shim/cc"
