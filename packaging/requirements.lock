# Runtime dependency closure of the release image, Python 3.12 (Ubuntu 24.04).
#
# Pinned to the set the pipeline is run and tested with (v6-python's
# requirements.lock of 2026-09-07), plus what Python 3.12 needs on top of it
# (typing_extensions). v5-python/requirements.txt floats on >= and is what a
# source checkout installs; this file is what packaging/release.sh builds with,
# so every build of a version gets the same libraries.
#
# Regenerate after an intentional upgrade, in a clean ubuntu:24.04 container:
#     python3 -m venv /v && /v/bin/pip install -r <requirements.txt without pytest>
#     /v/bin/pip freeze      (then re-add this header)

